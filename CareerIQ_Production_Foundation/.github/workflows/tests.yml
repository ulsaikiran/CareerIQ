name: CareerIQ checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app.py tests
      - name: Parse Jinja templates
        run: python -c "from jinja2 import Environment; from pathlib import Path; Environment().parse(Path('templates/page.html').read_text()); print('Jinja template syntax OK')"
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
